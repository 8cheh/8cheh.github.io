<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>8cheh</title>
    <style>
      body{font-family:system-ui,-apple-system,Segoe UI,Roboto,"Helvetica Neue",Arial;max-width:980px;margin:20px auto;padding:0 16px;color:#111}
      header{display:flex;align-items:center;justify-content:space-between;gap:12px}
      h1{margin:.2em 0;font-size:1.2rem}
      section{margin-top:20px}
      .card{border:1px solid #e6e6e6;border-radius:8px;padding:12px}
      ul.repo-list, ul.post-list{list-style:none;padding:0;margin:0}
      li.repo-item, li.post-item{padding:8px 6px;border-bottom:1px dashed #f0f0f0;display:flex;justify-content:space-between;align-items:center}
      li.repo-item:last-child, li.post-item:last-child{border-bottom:none}
      a{color:#0366d6;text-decoration:none}
      a:hover{text-decoration:underline}
      .meta{color:#666;font-size:.85em}
      #post-viewer{margin-top:12px}
      .empty{color:#666}
      .controls{display:flex;gap:8px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
      .btn{background:#0366d6;color:#fff;padding:6px 10px;border-radius:6px;border:none;cursor:pointer}
      .btn.secondary{background:#f6f8fa;color:#111;border:1px solid #e1e4e8}
      .input{padding:6px;border:1px solid #e1e4e8;border-radius:6px}
      pre{background:#0d1117;color:#c9d1d9;padding:12px;border-radius:6px;overflow:auto}
      iframe.doc-embed{width:100%;height:600px;border:1px solid #e6e6e6;border-radius:6px}
      .small{font-size:.85em;color:#666}
      @media (prefers-color-scheme:dark){
        body{background:#0b1220;color:#c9d1d9}
        .card{border-color:#21262d}
        a{color:#58a6ff}
        pre{background:#010409}
      }
    </style>
  </head>
  <body>
    <header>
      <div>
        <h1>8cheh 的网站</h1>
        <div class="small">聚合仓库与文章 — 交互优化版</div>
      </div>
      <div style="display:flex;gap:8px;align-items:center">
        <button id="refresh-repos" class="btn secondary">刷新仓库</button>
        <button id="refresh-posts" class="btn secondary">刷新文章</button>
      </div>
    </header>

    <section id="repos" class="card">
      <h2 style="margin-top:0">仓库</h2>
      <div class="controls">
        <input id="repo-search" class="input" placeholder="搜索仓库（按名/描述）" />
        <label class="small">显示：</label>
        <select id="repo-filter" class="input">
          <option value="all">全部</option>
          <option value="forks">只看 fork</option>
          <option value="sources">只看源仓库</option>
        </select>
      </div>
      <div id="repos-container"><p class="empty">加载中…</p></div>
    </section>

    <section id="posts" class="card">
      <h2 style="margin-top:0">文章</h2>
      <div class="controls">
        <input id="post-search" class="input" placeholder="搜索文章（文件名/扩展名）" />
        <select id="post-type" class="input">
          <option value="all">所有类型</option>
          <option value="md">Markdown (.md)</option>
          <option value="docx">.docx</option>
          <option value="pdf">.pdf</option>
        </select>
        <label class="small">排序：</label>
        <select id="post-sort" class="input">
          <option value="name">按名称</option>
          <option value="size">按大小</option>
          <option value="date">按修改时间（GitHub API 不返回单文件更新时间）</option>
        </select>
      </div>

      <div style="display:flex;gap:16px;align-items:flex-start">
        <div style="flex:1">
          <div id="posts-container"><p class="empty">加载中…</p></div>
        </div>
        <div style="flex:1;min-width:320px">
          <div id="post-viewer"><p class="empty">选择一篇文章预览</p></div>
        </div>
      </div>
    </section>

    <footer style="margin-top:20px;font-size:.85em;color:#666">已简化说明，增强搜索与预览交互。支持预览：Markdown、.docx、PDF（内嵌）。</footer>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://unpkg.com/mammoth/mammoth.browser.min.js"></script>
    <script>
      // Basic config
      const username = '8cheh';
      const repoName = `${username}.github.io`;
      const apiBase = 'https://api.github.com';
      const rawBase = `https://raw.githubusercontent.com/${username}/${repoName}/main/`;

      // caches
      let reposCache = [];
      let postsCache = [];

      // helpers
      function $(id){ return document.getElementById(id); }
      function setHTML(id, html){ const el = $(id); if(el) el.innerHTML = html; }
      function mk(tag, props={}, ...children){ const e = document.createElement(tag); Object.assign(e, props); for(const c of children) if(typeof c === 'string') e.appendChild(document.createTextNode(c)); else if(c) e.appendChild(c); return e; }

      async function fetchJson(url, options={}){
        try{
          const res = await fetch(url, Object.assign({headers:{'Accept':'application/vnd.github.v3+json'}}, options));
          if(!res.ok) throw new Error(`HTTP ${res.status} ${res.statusText}`);
          return await res.json();
        }catch(err){
          throw err;
        }
      }

      async function fetchArrayBuffer(url){
        const res = await fetch(url);
        if(!res.ok) throw new Error(`HTTP ${res.status} ${res.statusText}`);
        return await res.arrayBuffer();
      }

      // load repos
      async function loadRepos(){
        const container = $('repos-container');
        container.innerHTML = '<p class="empty">加载中…</p>';
        try{
          const url = `${apiBase}/users/${username}/repos?per_page=100`;
          const data = await fetchJson(url);
          reposCache = Array.isArray(data)? data : [];
          renderRepos(reposCache);
        }catch(err){
          container.innerHTML = `<p class="empty">加载仓库失败：${err.message}</p>`;
          console.error('loadRepos error', err);
        }
      }

      function renderRepos(list){
        const container = $('repos-container');
        if(!list || list.length === 0){ container.innerHTML = '<p class="empty">没有仓库</p>'; return; }
        const ul = document.createElement('ul'); ul.className = 'repo-list';
        list.forEach(r=>{
          const li = mk('li',{className:'repo-item'});
          const left = mk('div');
          const a = mk('a',{href:r.html_url,target:'_blank'}, r.full_name);
          const desc = mk('div',{className:'meta'}, r.description || '');
          left.appendChild(a); left.appendChild(desc);
          const right = mk('div');
          const stars = mk('div',{className:'meta'}, `⭐ ${r.stargazers_count || 0}`);
          right.appendChild(stars);
          li.appendChild(left); li.appendChild(right);
          ul.appendChild(li);
        });
        container.innerHTML = '';
        container.appendChild(ul);
      }

      // load posts (list files in repo root)
      async function loadPosts(){
        const container = $('posts-container');
        container.innerHTML = '<p class="empty">加载中…</p>';
        try{
          const url = `${apiBase}/repos/${username}/${repoName}/contents`;
          const data = await fetchJson(url);
          // filter files only
          postsCache = (Array.isArray(data)? data.filter(f=>f.type==='file') : []).map(f=>({
            name:f.name, path:f.path, download_url:f.download_url, size:f.size
          }));
          renderPosts(postsCache);
        }catch(err){
          container.innerHTML = `<p class="empty">加载文章失败：${err.message}</p>`;
          console.error('loadPosts error', err);
        }
      }

      function renderPosts(list){
        const container = $('posts-container');
        if(!list || list.length === 0){ container.innerHTML = '<p class="empty">没有文章文件</p>'; return; }
        const ul = document.createElement('ul'); ul.className = 'post-list';
        list.forEach(p=>{
          const li = mk('li',{className:'post-item'});
          const left = mk('div');
          const a = mk('a',{href:'#', 'data-path':p.path}, p.name);
          a.addEventListener('click', (e)=>{ e.preventDefault(); openPost(p); });
          const meta = mk('div',{className:'meta'}, `${(p.size||0)} bytes`);
          left.appendChild(a); left.appendChild(meta);
          li.appendChild(left);
          ul.appendChild(li);
        });
        container.innerHTML = '';
        container.appendChild(ul);
      }

      // open post and preview according to extension
      async function openPost(p){
        const viewer = $('post-viewer');
        viewer.innerHTML = '<p class="empty">加载中…</p>';
        const ext = (p.name.split('.').pop()||'').toLowerCase();
        try{
          if(ext === 'md' || ext === 'markdown'){
            // fetch raw markdown and render
            const rawUrl = p.download_url || (rawBase + p.path);
            const res = await fetch(rawUrl);
            if(!res.ok) throw new Error(`HTTP ${res.status}`);
            const txt = await res.text();
            viewer.innerHTML = '';
            const div = mk('div');
            div.innerHTML = marked.parse(txt);
            viewer.appendChild(div);
          }else if(ext === 'docx'){
            // fetch as arraybuffer and convert using mammoth
            const url = p.download_url || (rawBase + p.path);
            const ab = await fetchArrayBuffer(url);
            const result = await mammoth.convertToHtml({arrayBuffer:ab});
            viewer.innerHTML = result.value;
          }else if(ext === 'pdf'){
            const iframe = mk('iframe',{className:'doc-embed', src: p.download_url || (rawBase + p.path)});
            viewer.innerHTML = '';
            viewer.appendChild(iframe);
          }else{
            // other types: show raw text if small
            const rawUrl = p.download_url || (rawBase + p.path);
            const res = await fetch(rawUrl);
            if(!res.ok) throw new Error(`HTTP ${res.status}`);
            const txt = await res.text();
            viewer.innerHTML = '';
            const pre = mk('pre'); pre.textContent = txt.substring(0, 20000);
            viewer.appendChild(pre);
          }
        }catch(err){
          viewer.innerHTML = `<p class="empty">预览失败：${err.message}</p>`;
          console.error('openPost error', err);
        }
      }

      // wire controls
      function wire(){
        $('refresh-repos').addEventListener('click', ()=>loadRepos());
        $('refresh-posts').addEventListener('click', ()=>loadPosts());
        $('repo-search').addEventListener('input', debounce(()=>{
          const q = $('repo-search').value.trim().toLowerCase();
          const filter = $('repo-filter').value;
          let list = reposCache.slice();
          if(filter === 'forks') list = list.filter(r=>r.fork);
          if(filter === 'sources') list = list.filter(r=>!r.fork);
          if(q) list = list.filter(r=> (r.name||'').toLowerCase().includes(q) || (r.description||'').toLowerCase().includes(q));
          renderRepos(list);
        }, 200));

        $('repo-filter').addEventListener('change', ()=>{
          const evt = new Event('input'); $('repo-search').dispatchEvent(evt);
        });

        $('post-search').addEventListener('input', debounce(()=>{
          const q = $('post-search').value.trim().toLowerCase();
          const type = $('post-type').value;
          let list = postsCache.slice();
          if(type !== 'all') list = list.filter(p=> p.name.toLowerCase().endsWith('.'+type));
          if(q) list = list.filter(p=> p.name.toLowerCase().includes(q));
          renderPosts(list);
        },200));

        $('post-type').addEventListener('change', ()=>{ $('post-search').dispatchEvent(new Event('input')); });
        $('post-sort').addEventListener('change', ()=>{
          const v = $('post-sort').value;
          let list = postsCache.slice();
          if(v === 'name') list.sort((a,b)=>a.name.localeCompare(b.name));
          if(v === 'size') list.sort((a,b)=> (a.size||0)-(b.size||0));
          renderPosts(list);
        });
      }

      // init
      document.addEventListener('DOMContentLoaded', ()=>{
        wire();
        loadRepos();
        loadPosts();
      });

    </script>
  </body>
</html>
